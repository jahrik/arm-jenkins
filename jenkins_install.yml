---
###################
# Install Jenkins #
###################

- name: Install java8
  apt:
    name: openjdk-8-jre
    state: present
  tags:
    - java

- name: Add apt signing key for Jenkins
  apt_key:
    url: "{{ jenkins.key_url }}"
    state: present
  tags:
    - jenkins

- name: Add apt repository for Jenkins
  apt_repository:
    repo: "{{ jenkins.repo }}"
    state: present
  tags:
    - jenkins

- name: Install Jenkins
  apt:
    name: jenkins
    state: present
    update_cache: yes
  tags:
    - jenkins

