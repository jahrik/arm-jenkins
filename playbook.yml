---
- hosts: java
  become: true
  become_method: sudo
  tasks:

    - name: Install Java
      include_tasks: java_install.yml
      tags:
        - java

- hosts: jenkins
  become: true
  become_method: sudo
  tasks:

    - name: Install Jenkins
      include_tasks: jenkins_install.yml
      tags:
        - jenkins

    - name: Install Ansible
      include_tasks: ansible_install.yml
      tags:
        - ansible

- hosts: all
  become: true
  become_method: sudo
  tasks:

    - name: Install docker
      include_tasks: docker_install.yml
      tags:
        - docker

- hosts: cluster
  become: true
  become_method: sudo
  tasks:

    - name: Setup Hosts in cluster
      include_tasks: cluster_setup.yml
      tags:
        - cluster
