---
###################
# Install Docker #
###################

- name: Add apt signing key for Docker
  apt_key:
    url: "{{ docker.key_url }}"
    state: present
  tags:
    - docker

- name: Add apt repository for Docker
  apt_repository:
    repo: "{{ docker.repo }}"
    state: present
    filename: docker
  tags:
    - docker

- name: Install Docker
  apt:
    name: docker-ce:armhf
    state: present
    update_cache: yes
  tags:
    - docker

- name: Install pip
  package:
    name: python-pip
    state: present
  tags:
    - cluster
    - pip

- name: install docker-py
  pip:
    name: "{{ item }}"
  with_items:
    - setuptools
    - docker-py
  tags:
    - cluster
    - pip

- name: Log into DockerHub
  docker_login:
    username: "{{ docker.user }}"
    password: "{{ docker.pass }}"
    email: "{{ docker.email }}"
  tags:
    - cluster
    - docker
