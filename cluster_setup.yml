---
#############################
# Add Jenkins user to hosts #
#############################
- name: Ensure group jenkins exists
  group:
    name: "{{ jenkins.user }}"
    state: present
  tags:
    - cluster

- name: Add Jenkins user to all hosts
  user:
    name: "{{ jenkins.user }}"
    uid: "{{ jenkins.uid }}"
    group: "{{ jenkins.group }}"
  tags:
    - cluster

- name: Enable passwordless sudo for jenkins user
  template:
    src: sudoers.j2
    dest: "/etc/sudoers.d/{{ jenkins.user }}"
    validate: '/usr/sbin/visudo -cf %s'
  tags:
    - cluster
